name: Dev Publish

on:
  push:
    branches: [develop]
    paths:
      - 'bricks/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: dev-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-dev:
    name: Publish @focus-mcp/* bricks@dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@focus-mcp'
      - run: pnpm install --frozen-lockfile
      - name: Upgrade npm for OIDC Trusted Publishing support
        run: npm install -g npm@latest
      - name: Apply changeset snapshot versions
        run: |
          # Runs from repo root — reads .changeset/*.md and bumps all packages
          # with pending changesets to their next version + snapshot suffix
          # (e.g. 1.2.0-dev-20260428-abc1234).
          pnpm changeset version --snapshot dev
      - run: pnpm build
      - run: pnpm build:catalog
      - name: Publish all packages with dev tag
        run: pnpm changeset publish --no-git-tag --tag dev
        # NODE_AUTH_TOKEN fallback: kept for rollback if Trusted Publisher not yet configured on npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
