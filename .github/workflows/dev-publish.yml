name: Dev Publish

on:
  push:
    branches: [develop]
    paths:
      - 'bricks/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: dev-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-dev:
    name: Publish @focus-mcp/* bricks@dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@focus-mcp'
      - run: pnpm install --frozen-lockfile
      - name: Check for pending changesets
        id: pending
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | xargs)
          echo "count=$PENDING" >> $GITHUB_OUTPUT
          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets — skipping dev publish."
          fi
      - name: Apply changeset snapshot versions
        if: steps.pending.outputs.count != '0'
        run: pnpm changeset version --snapshot dev
      - name: Build
        if: steps.pending.outputs.count != '0'
        run: pnpm build
      - name: Build catalog
        if: steps.pending.outputs.count != '0'
        run: pnpm build:catalog
      - name: Publish all packages with dev tag
        if: steps.pending.outputs.count != '0'
        run: pnpm changeset publish --no-git-tag --tag dev
        # Auth: Trusted Publishers (OIDC) via id-token: write permission.
        # NPM_CONFIG_PROVENANCE=true triggers npm to mint an OIDC token from GitHub
        # Actions and exchange it for a publish token at the registry, so no static
        # NPM_TOKEN secret is required. NODE_AUTH_TOKEN kept as fallback if needed.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
