name: Stable Publish

on:
  push:
    branches: [main]
    paths:
      - "bricks/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: stable-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-stable:
    name: Publish @focus-mcp/brick-* with @latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@focus-mcp'
      - run: pnpm install --frozen-lockfile
      # catalog is always regenerated — it reads source package.json files and needs no dist
      - run: pnpm build:catalog
      - name: Deploy catalog.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          exclude_assets: 'bricks.md,bricks.md.license,*.license'
          keep_files: true
          commit_message: 'chore(catalog): deploy to gh-pages after stable publish [skip ci]'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      # Strategy: diff local package.json version vs npm registry @latest.
      # Only bricks whose version has changed are built then published.
      # Bricks already at the latest version on npm are skipped entirely — no build, no publish.
      # Follow-up idea: replace `npm view` loop with `pnpm changeset status --output`
      # for intent-based (changeset-driven) filtering instead of state-based (registry diff).
      - name: Build and publish only bumped bricks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # Build a name->dir reverse map up front
          declare -A DIRS
          for dir in bricks/*/; do
            [ -f "${dir}package.json" ] || continue
            NAME=$(node -e "console.log(require('./${dir}package.json').name)")
            DIRS["$NAME"]="$dir"
          done

          # Identify bricks whose local version differs from npm @latest
          bumped=()
          for NAME in "${!DIRS[@]}"; do
            dir="${DIRS[$NAME]}"
            LOCAL=$(node -e "console.log(require('./${dir}package.json').version)")
            # If the package doesn't exist on npm yet, `npm view` exits non-zero -> treat as new (bumped)
            NPM_VER=$(npm view "$NAME" version 2>/dev/null || echo "none")
            if [ "$LOCAL" != "$NPM_VER" ]; then
              echo "  -> will build/publish: $NAME ($NPM_VER -> $LOCAL)"
              bumped+=("$NAME")
            else
              echo "  skip: $NAME already at $LOCAL"
            fi
          done

          if [ ${#bumped[@]} -eq 0 ]; then
            echo "Nothing to publish -- all bricks are already at their current version on npm."
            exit 0
          fi

          # Build only the bumped bricks (pnpm --filter accepts multiple --filter flags)
          FILTERS=()
          for NAME in "${bumped[@]}"; do
            FILTERS+=(--filter "$NAME")
          done
          pnpm "${FILTERS[@]}" run build

          # Publish each bumped brick
          # If the version already exists on npm (e.g. published earlier as @dev),
          # just promote it to @latest via dist-tag instead of re-publishing.
          for NAME in "${bumped[@]}"; do
            dir="${DIRS[$NAME]}"
            LOCAL=$(node -e "console.log(require('./${dir}package.json').version)")
            EXISTS=$(npm view "$NAME@$LOCAL" version 2>/dev/null || echo "none")
            if [ "$EXISTS" = "$LOCAL" ]; then
              echo "Promoting $NAME@$LOCAL to @latest (already on npm as @dev)..."
              npm dist-tag add "$NAME@$LOCAL" latest
            else
              echo "Publishing $NAME@$LOCAL from $dir..."
              (cd "$dir" && npm publish --access public --tag latest)
            fi
          done

          # Export bumped list for downstream steps
          # Format: "name@version" one per line, stored in GITHUB_STEP_SUMMARY file area
          {
            for NAME in "${bumped[@]}"; do
              dir="${DIRS[$NAME]}"
              VER=$(node -e "console.log(require('./${dir}package.json').version)")
              echo "${NAME}@${VER}"
            done
          } > /tmp/published-bricks.txt
          echo "--- Published bricks ---"
          cat /tmp/published-bricks.txt

      - name: Create release tag
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Skip if nothing was published (empty file or file missing)
          if [ ! -s /tmp/published-bricks.txt ]; then
            echo "No bricks were published — skipping tag creation."
            exit 0
          fi

          # Convention: release-YYYY-MM-DD (Option B: one tag per release wave)
          # If multiple releases happen the same day, append a counter: release-YYYY-MM-DD-2
          BASE_TAG="release-$(date -u +%Y-%m-%d)"
          TAG="$BASE_TAG"
          COUNTER=2
          while git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; do
            TAG="${BASE_TAG}-${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done

          echo "Creating tag: $TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release wave: $TAG"
          git push origin "$TAG"
          echo "TAG_NAME=${TAG}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: success() && env.TAG_NAME != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Build release body from published-bricks.txt
          BRICKS_LIST=""
          while IFS= read -r line; do
            BRICKS_LIST="${BRICKS_LIST}- \`${line}\`"$'\n'
          done < /tmp/published-bricks.txt

          # Detect pre-release: any published version contains a hyphen (e.g. 1.0.0-beta.1)
          IS_PRERELEASE="false"
          if grep -qE '@[^@]+-' /tmp/published-bricks.txt 2>/dev/null; then
            IS_PRERELEASE="true"
          fi

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          RELEASE_NOTES="## Bricks published in this wave

${BRICKS_LIST}
---
*Auto-generated by stable-publish workflow — tag convention: \`release-YYYY-MM-DD\`*"

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$RELEASE_NOTES" \
            $PRERELEASE_FLAG
